name: Instalador Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # só usado para anexar o instalador a uma release em tags v*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Gerar executável (PyInstaller)
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/lume.spec --noconfirm --distpath dist --workpath build

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = python -c "import sys; sys.path.insert(0,'src'); import lume; print(lume.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Lume-Setup
          path: dist/installer/*.exe

      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
